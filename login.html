<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <!-- حاوية صفحة تسجيل الدخول -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 space-y-6">
        
        <!-- الهيدر / العنوان -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl mb-2">
                <i data-lucide="log-in" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">مرحباً بعودتك</h1>
            <p class="text-sm text-slate-500">أدخل بياناتك لتسجيل الدخول إلى حسابك</p>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form action="dashboard.html" method="POST" class="space-y-4">
            
            <!-- حقل البريد الإلكتروني -->
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">البريد الإلكتروني</label>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="mail" class="w-5 h-5"></i>
                    </div>
                    <input type="email" id="email" name="email" required placeholder="name@example.com"
                        class="w-full pr-10 pl-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm text-slate-800">
                </div>
            </div>

            <!-- حقل كلمة المرور -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="password" class="block text-sm font-medium text-slate-700">كلمة المرور</label>
                    <a href="forgot-password.html" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700">نسيت كلمة المرور؟</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                    </div>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        class="w-full pr-10 pl-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-sm text-slate-800">
                </div>
            </div>

            <!-- خيار تذكرني -->
            <div class="flex items-center">
                <input type="checkbox" id="remember" name="remember" class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500">
                <label for="remember" class="mr-2 text-sm text-slate-600">تذكرني على هذا الجهاز</label>
            </div>

            <!-- زر تسجيل الدخول -->
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-md shadow-indigo-600/20 flex items-center justify-center gap-2">
                <span>تسجيل الدخول</span>
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- رابط إنشاء حساب جديد -->
        <div class="text-center text-sm text-slate-500 border-t border-slate-100 pt-4">
            ليس لديك حساب؟ 
            <a href="register.html" class="font-bold text-indigo-600 hover:text-indigo-700">أنشئ حساباً جديداً</a>
        </div>
    </div>

    <!-- تفعيل الأيقونات -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
